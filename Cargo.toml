[package]
name = "afz-rust"
description = "autofuzz Rust harness plugin: source-level discovery plus a generated cargo driver that speaks the plugin protocol over stdio"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[[bin]]
name = "afz-rust"
path = "src/main.rs"

# The conformance emitter: renders the fixture crate, `autofuzz.json`, and the manifest.
[[bin]]
name = "afz-rust-emit"
path = "src/bin/emit.rs"

# The conformance project's fixture validator: reads the fixture with `syn` and executes it
# with `rustc`, with no protocol and no plugin in the path.
[[bin]]
name = "afz-rust-check"
path = "src/bin/check.rs"

[dependencies]
# The wire types are the engine's, consumed from the engine repository's git history: they are
# one contract written once, not a copy that can drift.
afz-protocol = { git = "https://github.com/DustinEwan/autofuzz.git", branch = "main" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
sha2 = "0.11.1"
syn = { version = "2.0.119", features = ["full", "extra-traits", "visit"] }
quote = "1.0.47"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
rustc-demangle = "0.1.28"

[profile.release]
# Inherited from the engine workspace, where the driver child's arithmetic is checked today:
# dropping it would silently change what the release build does on overflow.
overflow-checks = true
